[project]
name = "game-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "angxuejian", email = "xuejian.ang@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.28.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
game-harness = "game_harness:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.6",
]
